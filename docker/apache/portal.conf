<VirtualHost *:80>
    ServerName portal.starlan.club
    ServerAdmin webmaster@starlan.club
    DocumentRoot /opt/portal/public

    <Directory /opt/portal/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/portal_error.log
    CustomLog ${APACHE_LOG_DIR}/portal_access.log combined
</VirtualHost>
