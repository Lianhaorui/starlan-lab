<VirtualHost *:81>
    ServerName admin.starlan.club
    ServerAdmin webmaster@starlan.club
    DocumentRoot /opt/admin/public

    <Directory /opt/admin/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/admin_error.log
    CustomLog ${APACHE_LOG_DIR}/admin_access.log combined
</VirtualHost>
