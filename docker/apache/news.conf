<VirtualHost *:82>
    ServerName news.starlan.club
    ServerAdmin webmaster@starlan.club
    DocumentRoot /opt/news

    <Directory /opt/news>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/news_error.log
    CustomLog ${APACHE_LOG_DIR}/news_access.log combined
</VirtualHost>
