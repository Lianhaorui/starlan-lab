services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: labroot
      MYSQL_DATABASE: lab
      MYSQL_USER: lab
      MYSQL_PASSWORD: labpass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/mysql-client.cnf:/etc/mysql/conf.d/charset.cnf:ro
    networks: [public, internal]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ulab", "-plabpass"]
      interval: 5s
      timeout: 3s
      retries: 30

  metadata:
    build: ./metadata
    networks:
      metadata_link:
        ipv4_address: 169.254.169.254

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports: ["8101:80", "8201:81", "8301:82"]
    environment:
      NEWS_PORT: "8301"
      DB_HOST: mysql
      DB_USER: lab
      DB_PASS: labpass
      DB_PORTAL_DB: lab_portal
      DB_ADMIN_DB: lab_admin
      DB_NEWS_DB: lab_news
    depends_on:
      mysql:
        condition: service_healthy
      metadata:
        condition: service_started
    networks: [public, internal, metadata_link]

networks:
  public:
    ipam:
      config:
        - subnet: 172.24.0.0/24
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.24.1.0/24
  metadata_link:
    internal: true
    ipam:
      config:
        - subnet: 169.254.169.0/24

volumes:
  mysql_data:
